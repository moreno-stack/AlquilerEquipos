# Construye la aplicación de escritorio para Windows y macOS y la publica en "Releases".
#
# No hay que crear etiquetas a mano: cada push a main construye y publica (o actualiza) la
# Release "v<versión>", tomando la versión de alquiler/__init__.py. Para sacar una versión
# nueva basta con subir __version__ (p. ej. "0.2.0"). También se puede lanzar a mano en
# Actions → "Descargas" → Run workflow.

name: Descargas

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # cambios solo de documentación no reconstruyen
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear la Release y subir los archivos

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerías de sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  construir:
    name: ${{ matrix.nombre }}
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            so: windows-latest
            archivo: AlquilerEquipos-Windows.exe     # un solo archivo: se descarga y se abre
            opciones: --un-archivo
          - nombre: macOS
            so: macos-latest     # Apple Silicon (M1 en adelante)
            archivo: AlquilerEquipos-macOS.dmg       # un solo archivo: al abrirlo aparece la app
            opciones: ""
    runs-on: ${{ matrix.so }}
    env:
      QT_QPA_PLATFORM: offscreen   # autoprueba sin pantalla
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Íconos
        run: python scripts/generar_iconos.py

      - name: Construir y verificar (autoprueba del ejecutable)
        run: python scripts/empaquetar.py ${{ matrix.opciones }}

      - name: Aplicación de Windows (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\AlquilerEquipos.exe ${{ matrix.archivo }}

      - name: Aplicación de macOS (.dmg con la app y nada más)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R dist/AlquilerEquipos.app dmg/
          hdiutil create -volname "Alquiler de Equipos" -srcfolder dmg -ov -format UDZO ${{ matrix.archivo }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.archivo }}

  publicar:
    name: Publicar la Release
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: echo "valor=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("alquiler/__init__.py").read()).group(1))')" >> "$GITHUB_OUTPUT"

      - name: Borrar las descargas viejas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="v${{ steps.version.outputs.valor }}"
          # Releases de versiones anteriores (con sus .zip, .dmg o instaladores): se borran.
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            if [ "$tag" != "$actual" ]; then
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
          # En la Release actual solo quedan los dos archivos de la aplicación.
          if gh release view "$actual" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            for archivo in $(gh release view "$actual" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              case "$archivo" in
                AlquilerEquipos-Windows.exe|AlquilerEquipos-macOS.dmg) ;;
                *) gh release delete-asset "$actual" "$archivo" -R "$GITHUB_REPOSITORY" --yes ;;
              esac
            done
          fi

      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.valor }}   # se crea sola si no existe
          target_commitish: ${{ github.sha }}
          name: Alquiler de Equipos v${{ steps.version.outputs.valor }}
          make_latest: true
          overwrite_files: true                          # cada push reemplaza los archivos
          files: descargas/*
          body: |
            ## Descargar

            | Sistema | Archivo | Qué hacer |
            |---|---|---|
            | Windows 10/11 | **AlquilerEquipos-Windows.exe** | Descárguelo y ábralo con doble clic. No se instala nada |
            | macOS (M1 en adelante) | **AlquilerEquipos-macOS.dmg** | Ábralo: aparece la app *AlquilerEquipos*. Doble clic sobre ella (o arrástrela a Aplicaciones) |

            La primera vez el sistema avisa que la app no está firmada:
            - **Windows:** "Más información" → "Ejecutar de todas formas".
            - **macOS:** clic derecho sobre la app → "Abrir" → "Abrir".

            Usuario de prueba: `admin` / `admin1234` (al primer arranque puede cargar datos de demostración).

            **IA:** entre como administrador y pulse **Conectar IA** (abajo a la derecha); pegue su clave
            de Groq una sola vez y queda guardada en ese computador.
