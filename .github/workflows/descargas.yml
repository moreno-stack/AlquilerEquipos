# Construye la aplicación de escritorio para Windows y macOS y la publica en "Releases".
#
# No hay que crear etiquetas a mano: cada push a main construye y publica (o actualiza) la
# Release "v<versión>", tomando la versión de alquiler/__init__.py. Para sacar una versión
# nueva basta con subir __version__ (p. ej. "0.2.0"). También se puede lanzar a mano en
# Actions → "Descargas" → Run workflow.

name: Descargas

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # cambios solo de documentación no reconstruyen
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear la Release y subir los archivos

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerías de sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  construir:
    name: ${{ matrix.nombre }}
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            so: windows-latest
            archivo: AlquilerEquipos-Windows-Instalador.exe
          - nombre: macOS
            so: macos-latest     # Apple Silicon (M1 en adelante)
            archivo: AlquilerEquipos-macOS.dmg
    runs-on: ${{ matrix.so }}
    env:
      QT_QPA_PLATFORM: offscreen   # pruebas y autoprueba sin pantalla
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Íconos
        run: python scripts/generar_iconos.py

      - name: Construir y verificar (autoprueba del ejecutable)
        run: python scripts/empaquetar.py

      - name: Instalador de Windows (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = python -c "import alquiler; print(alquiler.__version__)"
          & $iscc "/DVersion=$version" instalador\AlquilerEquipos.iss
          Copy-Item dist\${{ matrix.archivo }} ${{ matrix.archivo }}

      - name: Empaquetar para macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R dist/AlquilerEquipos.app dmg/
          cp alquiler.env.ejemplo dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Alquiler de Equipos" -srcfolder dmg -ov -format UDZO ${{ matrix.archivo }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.archivo }}

  publicar:
    name: Publicar la Release
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: echo "valor=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("alquiler/__init__.py").read()).group(1))')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.valor }}   # se crea sola si no existe
          target_commitish: ${{ github.sha }}
          name: Alquiler de Equipos v${{ steps.version.outputs.valor }}
          make_latest: true
          overwrite_files: true                          # cada push reemplaza los archivos
          files: descargas/*
          body: |
            ## Descargas

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 | **AlquilerEquipos-Windows-Instalador.exe**: ábralo, pulse *Instalar* y quedará el acceso directo en el escritorio |
            | macOS (Apple Silicon) | **AlquilerEquipos-macOS.dmg**: abra el .dmg y arrastre la app a Aplicaciones |

            La primera vez el sistema puede avisar que la app no está firmada:
            - **Windows:** "Más información" → "Ejecutar de todas formas".
            - **macOS:** clic derecho sobre la app → "Abrir" → "Abrir".

            Para activar la IA, copie `alquiler.env.ejemplo` como `alquiler.env`, pegue su clave
            de Groq y guárdelo en la carpeta `.alquiler_equipos` de su usuario (Windows y macOS).
